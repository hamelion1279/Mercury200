# =====================================================================
#  Эмулятор расхода — гоняет конвейер HA (template -> utility_meter ->
#  таблица) без реального расхода воды. Добавляет «м³» в служебные
#  offset-накопители, которые учтены в «Реальных показаниях».
#  После теста обнулите water_sim_offset_* вручную (или введите
#  показания кнопкой — автоматизация вычтет симуляцию из базы).
# =====================================================================
script:
  simulate_water_step:
    alias: "Вода: один шаг эмуляции"
    icon: mdi:water-plus
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.water_sim_offset_cold
        data:
          value: >
            {{ states('input_number.water_sim_offset_cold') | float(0)
               + states('input_number.water_sim_cold_step') | float(0.01) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.water_sim_offset_hot
        data:
          value: >
            {{ states('input_number.water_sim_offset_hot') | float(0)
               + states('input_number.water_sim_hot_step') | float(0.01) }}

  voda_emuliatsiia_raskhoda_seriia_shagov:
    alias: "Вода: эмуляция расхода — серия шагов"
    icon: mdi:fast-forward
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.water_sim_counter
        data:
          value: 0
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.water_sim_running
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ states('input_number.water_sim_counter') | int(0)
                   < states('input_number.water_sim_steps') | int(1)
                   and is_state('input_boolean.water_sim_running', 'on') }}
          sequence:
            - service: script.simulate_water_step
            - service: input_number.increment
              target:
                entity_id: input_number.water_sim_counter
            - delay:
                seconds: "{{ states('input_number.water_sim_interval') | int(2) }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_sim_running

  # Кнопка «СТОП» на дашборде — это input_boolean.water_sim_running:
  # нажатие гасит его, while в серии перестаёт выполняться и цикл выходит.
